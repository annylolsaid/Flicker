<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="CSS/formulario.css">
</head>
<body>
    <header>
        <h1>FORMULÁRIO DE CADASTRO</h1>
    </header>
    <nav>
        <a href="newsletter.html">VOLTAR AO NEWSLETTER</a>
    </nav>
    <main>
        <div class="formulario">
            <form action="">
                <label>Digite seu nome completo</label>
                <input type="text" placeholder="Digite seu nome">
                <br>
                <label>Digite seu CPF</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" inputmode="numeric">
                <br>
                <label>Digite seu E-mail</label>
                <input type="email " name ="email" placeholder="Digite seu E-mail">
                <br>
                <input type="submit" name="ASSINAR">
            </form>
            <img src="https://uploads.onecompiler.io/43qyrtjtk/44cnrx2x8/loja.m%C3%A3o%20rock%20roll.png" alt="mão" class="mão">
            <img src="https://uploads.onecompiler.io/43qyrtjtk/44cnrxm2n/loja.onda%20verde.png" alt="ondas" class="ondas">
            <img src="https://uploads.onecompiler.io/43qyrtjtk/44c3ag8qz/line-up.pontilhado.png" alt="pontilhado" class="pontilhado">
            <img src="https://uploads.onecompiler.io/43qyrtjtk/44cnrwkxb/loja.boca.png" alt="boca" class="boca">
        </div>
   </main>
</body>
</html>
